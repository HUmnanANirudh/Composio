name: Research checkpoint (scheduled)

# Resumes the 100-app run every few hours until every app has a final record.
# Each run picks up where the last one stopped (records are saved per app), works until
# every model in the fallback chain is out of quota or the step time budget runs out, then commits
# only data/results + site/ after the tests pass, and redeploys the Pages site.
on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write # to trigger the Pages deploy (pushes made with GITHUB_TOKEN don't)

concurrency:
  group: llm-quota # one runner at a time: runs share one Gemini key and the same files
  cancel-in-progress: false

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen

      - name: Restore page/search cache (the verifier re-checks quotes against these pages)
        uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: research-cache-${{ github.run_id }}
          restore-keys: research-cache-

      - name: Count finished apps
        id: progress
        run: |
          n=$(ls data/results/final/*.json 2>/dev/null | wc -l)
          echo "final=$n" >> "$GITHUB_OUTPUT"
          echo "Final records before this run: $n / 100"

      - name: Research (resumes; pauses only when every model is out of quota)
        if: steps.progress.outputs.final != '100'
        timeout-minutes: 320 # leaves time to save the cache and commit
        continue-on-error: true
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CONCURRENCY: "3"
        run: uv run research run 2>&1 | grep -vE "skipped|cached$" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Save page/search cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/cache
          key: research-cache-${{ github.run_id }}

      - name: Score, patterns, site bundle
        run: |
          uv run research evaluate
          uv run research patterns
          uv run research build-site

      - name: Tests gate the commit
        run: uv run pytest -q

      - name: Commit checkpoint (results + site only)
        id: commit
        run: |
          git config user.name "research-checkpoint[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/results/pass1 data/results/final data/results/usage.jsonl \
                  data/results/eval.json data/results/patterns.json data/audit.json site/
          if git diff --cached --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"; echo "Nothing new to commit."; exit 0
          fi
          n=$(ls data/results/final/*.json | wc -l)
          git commit -m "Research checkpoint: $n/100 final records"
          for i in 1 2 3; do
            if git pull --rebase --quiet origin main && git push origin HEAD:main; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
            sleep $((i * 10))
          done
          echo "::error::push failed after 3 attempts"; exit 1

      - name: Redeploy the case study
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-errors
          path: data/results/errors/
          if-no-files-found: ignore
